[package]
name = "video_reader-rs"
version = "0.4.3"
edition = "2021"

[lib]
name = "video_reader"
crate-type = ["cdylib"]

[dependencies]
dlpark = { git = "https://github.com/SunDoge/dlpark/", rev = "ef4e63fa19d6cdda34a3146ee7d1ccdfa40907b7"}
env_logger = "0.11.8"
ffmpeg-next = "8.1.0"
libc = "0.2"
log = "0.4.29"
ndarray = { version = "0.16", features = ["rayon"] }
once_cell = "1.21"
pyo3 = { version = "0.27", features = ["extension-module"] }
rayon = "1.12.0"
tokio = { version = "1.48", features = ["full"] }
yuv = "0.8.13"

[features]
# enable this feature for ffmpeg version <= 5
ffmpeg_5 = []

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
